# conventions.yaml — naming, layout and SDLC phase mapping.

# SDLC phase -> wiki subdirectory (Waterfall order, 100단위 번호 체계).
# 도메인/서브도메인 중첩 번호는 domain_map.yaml 참조.
sdlc_phases:
  requirements:   "100 요구사항"
  design:         "200 디자인"
  implementation: "300 개발"
  test:           "400 테스트"
  deployment:     "500 배포"
  operation:      "600 운영"

entities_dir: _entities

# slug: lowercase latin / digits / Hangul, hyphen-separated
slug_pattern: "^[a-z0-9가-힣]+(-[a-z0-9가-힣]+)*$"
slug_max_words: 6

# stop words removed when generating a slug from a title
stop_words: [the, a, an, of, to, for, and, or, in, on, with, "정의서", "문서"]

frontmatter_required: [title, slug, type, status]

# wikilink syntax: [[slug]]
wikilink_pattern: "\\[\\[([a-z0-9가-힣-]+)\\]\\]"
