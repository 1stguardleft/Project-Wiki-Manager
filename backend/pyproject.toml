[project]
name = "project-wiki-manager-backend"
version = "0.1.0"
description = "LLM-maintained SDLC wiki — multi-agent ingest pipeline with live visualization"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "markdownify>=0.11",
    "langgraph>=0.2",
    "langchain-openai>=0.1",
    "openai>=1.30",
    "chromadb>=0.5",
    "rank-bm25>=0.2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
